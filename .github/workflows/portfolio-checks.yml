name: Portfolio checks
on:
  push:
    branches: [main]
    paths: ['index.html', 'library.html', 'assets/**', 'tests/**', 'tools/**', '.github/workflows/portfolio-checks.yml']
  pull_request:
    paths: ['index.html', 'library.html', 'assets/**', 'tests/**', 'tools/**', '.github/workflows/portfolio-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  homepage:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Structural and setup safety tests
        run: python -m unittest discover -s tests -v
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Browser checks and screenshots
        run: python tools/check_browser.py
      - name: Upload browser report and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portfolio-browser-evidence
          path: browser-output/
          if-no-files-found: warn
          retention-days: 30
